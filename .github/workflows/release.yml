name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and full history: the version decision needs both

      - name: Decide the version
        id: version
        run: ./.github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Compute the image reference
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # OCI names must be lowercase; GitHub Actions expressions have no lowercase operator

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
