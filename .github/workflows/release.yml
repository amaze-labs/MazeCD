# On every push to main — the same shape as IPMaze's Release:
#   1. compute the next version from the latest semver tag plus the commits after
#      it, one bump per commit (type!: major, feat: minor, anything else: patch
#      — see .github/scripts/next-version.sh, the same script as IPMaze's);
#   2. publish the image as <version> and latest. It is rebuilt when something
#      that ends up in it changed since the previous release, otherwise the
#      previous release is retagged;
#   3. only once the image is published, create and push the git tag <version>
#      (no "v" prefix), then the GitHub Release.
#
# The binary bakes the version in (`-X main.version`); a RETAGGED image keeps
# reporting the release that actually built it, which is the honest answer —
# nothing in it changed.
#
# One build for both architectures, on one amd64 runner: the Dockerfile
# cross-compiles (every stage that runs anything is `--platform=$BUILDPLATFORM`
# and Go is told GOARCH), so nothing is emulated and a native arm64 runner
# would only build the web bundle a second time.
#
# Pushing the tag does not re-trigger this workflow (it only runs on branches).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One release at a time, in order: two quick pushes must not compute the same
# version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write   # push the tag, create the GitHub Release
  packages: write   # push to ghcr.io

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
      skip: ${{ steps.next.outputs.skip }}
      rebuild: ${{ steps.changed.outputs.rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # full history for git describe and the log
          fetch-tags: true

      - name: Check the version script
        run: sh .github/scripts/next-version.test.sh

      - name: Next version
        id: next
        run: |
          set -eu
          version=$(.github/scripts/next-version.sh)
          previous=$(.github/scripts/next-version.sh --previous)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "HEAD is already tagged ${version}: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      # The comparison is against the last RELEASED version, not the previous
      # push: a release that failed halfway leaves no tag behind. A git tag only
      # exists once the image was published (see the `tag` job), so the image
      # of `previous` is guaranteed to exist and can be retagged.
      #
      # PATHS is what ends up in the image. Err on the side of too many: an
      # extra path costs a useless build, a missing one ships a stale image.
      - name: Did the image change?
        id: changed
        if: steps.next.outputs.skip != 'true'
        env:
          PREV: ${{ steps.next.outputs.previous }}
          PATHS: cmd internal web go.mod go.sum docker .dockerignore
        run: |
          set -eu
          # shellcheck disable=SC2086 # PATHS is a space-separated list
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" HEAD -- $PATHS; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "- image: rebuilt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "- image: retagged from \`${PREV}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (amd64 + arm64)
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        # GHCR rejects repository names with uppercase characters.
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, untagged: the tags are only added by `publish`, so a
      # build that fails halfway never moves `latest`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release,ignore-error=true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          # `source` connects the GHCR package to this repository: its page
          # shows the README, and visibility / access follow the repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # Attestations would show up as extra `unknown/unknown` entries in
          # the manifest list; nothing here consumes them.
          provenance: false
          sbom: false

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    # After a successful build, or on its own when nothing had to be rebuilt
    # (then the image is retagged from the previous release).
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.version.outputs.skip != 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.version.outputs.rebuild == 'false'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREV: ${{ needs.version.outputs.previous }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A rebuilt image gets the tags on the manifest list the build pushed; an
      # unchanged one gets the new tags added to the previous release's
      # manifest (metadata only, no layers travel, older tags stay put).
      #
      # GHCR sometimes 404s a manifest it accepted seconds earlier, and
      # `imagetools create` fails on an otherwise perfect build. Retry instead
      # of making the operator re-run the whole workflow.
      - name: Tag ${{ needs.version.outputs.version }} and latest
        run: |
          set -eu
          if [ -n "$DIGEST" ]; then
            source="${IMAGE}@${DIGEST}"
          else
            source="${IMAGE}:${PREV}"
          fi
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
                 --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                 --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest" "$source"; then
              echo "Published ${IMAGE}:${VERSION} on attempt ${attempt}."
              docker buildx imagetools inspect "${IMAGE}:${VERSION}"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait=$((attempt * 10))
              echo "::warning::imagetools create failed (attempt ${attempt}/5) — GHCR may not have propagated the digest yet; retrying in ${wait}s"
              sleep "$wait"
            fi
          done
          echo "::error::could not publish ${IMAGE}:${VERSION} after 5 attempts"
          exit 1

  tag:
    name: Tag ${{ needs.version.outputs.version }}
    needs: [version, publish]
    if: >-
      !cancelled() && needs.version.outputs.skip != 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # the release notes list the commits since `previous`
          fetch-tags: true

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}" "$GITHUB_SHA"
          # GitHub intermittently answers 500 to a ref push — sometimes AFTER
          # creating the ref. So a failed attempt first reads the remote tag: on
          # this commit = done (a re-run lands here too); on another commit =
          # never overwrite a release.
          for attempt in 1 2 3 4 5; do
            if git push origin "refs/tags/${VERSION}"; then
              break
            fi
            remote=$(git ls-remote origin "refs/tags/${VERSION}^{}" | cut -f1)
            if [ "$remote" = "$GITHUB_SHA" ]; then
              echo "Tag ${VERSION} is already on ${GITHUB_SHA}."
              break
            fi
            if [ -n "$remote" ]; then
              echo "::error::tag ${VERSION} already exists on ${remote}, not ${GITHUB_SHA}"
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push tag ${VERSION} after 5 attempts"
              exit 1
            fi
            wait=$((attempt * 15))
            echo "::warning::tag push failed (attempt ${attempt}/5); retrying in ${wait}s"
            sleep "$wait"
          done
          echo "Tagged ${VERSION} at ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      # The GitHub Release only describes what the tag already is: the image
      # and the tag are the release. So a failure here warns instead of failing
      # the run — a re-run would skip anyway, HEAD being tagged by then — and
      # prints the command that publishes it by hand. Notes come from the
      # commits, not from `--generate-notes`, which lists merged pull requests
      # and most changes here are pushed straight to `main`.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.previous }}
          REBUILT: ${{ needs.version.outputs.rebuild }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "${PREV:+${PREV}..}${VERSION}"
            echo
            echo "## Image"
            echo
            if [ "$REBUILT" = "true" ]; then
              echo "- \`ghcr.io/${REPO,,}:${VERSION}\`"
            else
              echo "- \`ghcr.io/${REPO,,}:${VERSION}\` (unchanged since ${PREV})"
            fi
          } > release-notes.md
          if gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file release-notes.md; then
            echo "Published the GitHub Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release ${VERSION} not created; the tag and the image are published. By hand: gh release create ${VERSION} --verify-tag --generate-notes"
          fi
