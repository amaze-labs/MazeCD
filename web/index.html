<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1` is the half that matters: iOS magnifies the page
         whenever a focused field's text is under 16px, and four of MazeCD's
         fields are mono at 12.5-13px on purpose. It honours this for that
         automatic zoom even where it ignores `user-scalable=no` for a pinch,
         so the fields keep their size and the page keeps still. In the
         installed PWA both are honoured, which is how this is actually used. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The browser's own chrome — the address bar on a phone, the status bar
         in the installed PWA — follows the theme too. Two tags, because a
         single colour that suited a dark app left a black strip above a white
         one. The dark value is the page ground, not the old #0A0F14, so the
         seam between the chrome and the app disappears. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <!-- iOS reads only this one when the PWA is added to the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MazeCD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
